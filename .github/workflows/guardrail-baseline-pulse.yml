# LIFECYCLE: permanent
# Weekly guardrail baseline health pulse (#9454).
# Records committed JSONL history and persists one tracking record when any
# nonzero baseline count has not decreased for 30 days. GitHub Issues are used
# when that road is open; repositories with Issues disabled write
# `.github/guardrail-staleness.md` instead of failing the pulse.
name: Guardrail baseline pulse

on:
  schedule:
    # Mondays 15:00 UTC
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Allow the job to push the recorded history line back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pulse and record snapshot
        id: pulse
        run: |
          set -euo pipefail
          python3 .github/scripts/guardrail_pulse.py --json --record | tee /tmp/pulse.json
          set +e
          python3 .github/scripts/guardrail_pulse.py --check-staleness > /tmp/staleness.txt
          status=$?
          set -e
          echo "staleness_exit=${status}" >> "$GITHUB_OUTPUT"
          cat /tmp/staleness.txt
          {
            echo "## Guardrail baseline pulse"
            echo
            echo '```'
            python3 .github/scripts/guardrail_pulse.py
            echo '```'
            echo
            echo "### Staleness"
            echo
            echo '```'
            cat /tmp/staleness.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist staleness tracker
        if: steps.pulse.outputs.staleness_exit == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 .github/scripts/guardrail_pulse.py --upsert-tracker \
            --staleness-file /tmp/staleness.txt \
            --run-url "${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}" \
            --tracker-path .github/guardrail-staleness.md \
            --repo "$REPO"

      - name: Commit history snapshot
        run: |
          set -euo pipefail
          git add -- .github/guardrail-pulse-history.jsonl
          if [[ -f .github/guardrail-staleness.md ]]; then
            git add -- .github/guardrail-staleness.md
          fi
          if git diff --cached --quiet; then
            echo "No history change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: record weekly guardrail baseline pulse"
          git push
